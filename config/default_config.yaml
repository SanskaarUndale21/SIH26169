# Default configuration for the FSOC coarse-alignment tracker.
# Every parameter from the problem-statement spec (screen/camera/target/PTZ/
# disturbances) is here with the suggested default value. All are overridable
# from the GUI config panel or by passing a different YAML file.

screen:
  width: 2000
  height: 2000

camera:
  type: mono          # mono | colour
  resolution: [640, 480]
  fov_deg: [4.0, 3.0]
  update_rate_hz: 30
  initial_position: center   # world (x,y) camera boresight starts at screen centre

target:
  type: beacon_spot
  num_targets: 1
  shape: square        # square | circle
  size_px: [10, 10]
  initial_location: random   # random | [x, y]
  motion: straight_line       # straight_line | circular | figure8 | random | spiral | sinusoidal | user_defined
  motion_params:
    straight_line: {speed_px_s: 60, angle_deg: 30}
    circular: {radius_px: 300, period_s: 20}
    figure8: {A_px: 300, B_px: 200, period_s: 24}
    random: {speed_px_s: 30, theta_std_deg: 25}
    spiral: {r0_px: 20, k_px_s: 15, period_s: 6}
    sinusoidal: {speed_px_s: 50, angle_deg: 0, amplitude_px: 120, period_s: 8}
    user_defined: {waypoints: "0,0; 150,0; 150,150; 0,150", speed_px_s: 60}

ptz:
  max_pan_speed_deg_s: 5.0
  max_tilt_speed_deg_s: 5.0
  update_interval_hz: 20

disturbances:
  noise:
    salt_pepper: {enabled: false, amount: 0.10}
    gaussian: {enabled: false, sigma: 10}
    poisson: {enabled: false}
  max_noise_std_px: 20
  jitter:
    enabled: false
    max_px: 20
    structured: false     # false = uniform random per-frame shift (spec default)
    resonance_hz: 8.0      # only used when structured: true -- see simulator/disturbances.py's
                           # StructuredJitterModel (reaction-wheel-like resonant vibration instead
                           # of flat noise)
  atmosphere:
    mode: clear   # clear | haze | fog | rain | low_light
    strength: 1.0 # scales contrast/brightness reduction: 0 none, 1 preset, 2 double
  turbulence:
    enabled: false
    r0: 0.05               # used directly unless physical: true
    physical: false        # true = derive r0 from a real Hufnagel-Valley Cn2 integration
                           # (simulator/link_budget.py) instead of the r0 value above
    wavelength_nm: 1550.0
    altitude_m: 20000.0
    zenith_deg: 0.0
  platform_motion:
    enabled: false
    mode: linear   # linear | circular | random | spiral | figure8
    max_px_frame: 5   # camera px per frame; spec allows up to +-20

# Link-budget context for the tracking-error numbers: translates pixel
# error into what it actually costs the FSOC link (see
# simulator/link_budget.py). None of this changes the tracking algorithm;
# it's additional reporting.
link_budget:
  beam_divergence_urad: 100.0           # ISRO mentor guidance: ~100 urad beacon divergence; 1/e^2 half-angle divergence of the laser beam
  fine_stage_capture_range_urad: 500.0  # angular error below which the fine-pointing stage can take over
  wavelength_nm: 1550.0
  range_km: 1000.0

# On-board computer pointing cue (simulator/obc_model.py). When enabled the
# camera first slews to the predicted beacon direction, then scans out to 3
# sigma around it. sigma_deg: per-pass random error; bias_deg: systematic
# error of the link (same every pass); link_seed: which link.
cue:
  enabled: false
  sigma_deg: 0.5
  bias_deg: 0.0
  link_seed: 1

# Named, physically-parametrized scenarios (simulator/scenario_presets.py):
# leo_leo_crosslink | leo_ground_downlink | geo_ground. Selecting one
# overrides target.motion/motion_params and link_budget with values
# derived from real orbital mechanics -- see simulator/orbital.py. Leave
# unset (null) to use the generic target/motion config above instead.
scenario_preset: null

detector:
  dog_sigma1: 1.0
  dog_sigma2: 3.0
  threshold_k: 4.0
  # min_blob_px / max_blob_px intentionally omitted: DetectorConfig derives
  # them from target.size_px by default (a tight window around the
  # configured target's actual pixel area), which rejects noise-sized
  # blobs far better than a fixed generic range. Set them explicitly here
  # only if a specific scenario needs an override.

tracker:
  process_noise_cv: 4.0
  process_noise_ct: 4.0
  process_noise_rw: 50.0
  measurement_noise: 1.0
  acquiring_confirm_frames: 6
  reacquire_timeout_frames: 30

control:
  pid:
    pan: {kp: 2.5, ki: 0.15, kd: 0.35}
    tilt: {kp: 2.5, ki: 0.15, kd: 0.35}

# Which algorithm runs each stage of the loop. Built-in ids: detector
# dog | threshold, tracker imm | kalman_cv | hold_last, controller pid |
# p_only. Your own plugins in user_algorithms/ appear as
# "user:<file>:<ClassName>". params are passed to the algorithm.
algorithms:
  detector: {id: dog, params: {}}
  tracker: {id: imm, params: {}}
  controller: {id: pid, params: {}}

logging:
  output_dir: logs
